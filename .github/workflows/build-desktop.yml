name: Build desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: CrateBuilder-macos
            zip_name: CrateBuilder-macos.zip
          - os: windows-latest
            artifact_name: CrateBuilder-windows
            zip_name: CrateBuilder-windows.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-desktop.txt

      - name: Build with PyInstaller
        run: pyinstaller desktop_app.spec

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        run: cd dist && zip -r -y "../${{ matrix.zip_name }}" CrateBuilder.app

      - name: Zip Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/CrateBuilder -DestinationPath ${{ matrix.zip_name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.zip_name }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/CrateBuilder-macos/CrateBuilder-macos.zip
            artifacts/CrateBuilder-windows/CrateBuilder-windows.zip
          generate_release_notes: true
